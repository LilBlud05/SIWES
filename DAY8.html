<!DOCTYPE html>
<html lang="en">
<head>
    <style>
    .gallery {
        display: flex;  
        flex-wrap: wrap;
        justify-content: flex-start;
    }

    .gallery-item {
        border: 1px solid #ccc;
        margin: 5px;
        width: 180px;
    }

    .gallery-item:hover {
        border: 1px solid #777;
    }

    .gallery-item img {
        width: 100px;
        height: auto;
    }

    .gallery-item .desc {
        padding: 15px;
        text-align: center;
    }
  




</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>


<body>
    <h2>CSS Image Gallery</h2>
    <p>A CSS image gallery is a collection of images that is displayed in an organized, and often responsive way, on a web page.</p>
    <p>Here we use CSS to create an image gallery:</p>

    <div class="gallery">
        <div class="gallery-item">
            <img src="/Gallery/img_5terre.jpg" alt="cinque terre" width="600" height="400">
            <div class="desc">Cinque Terre</div>
        </div>

        <div class="gallery-item">
            <img src="/Gallery/img_forest.jpg" alt="green forest" width="600" height="400">
            <div class="desc">Green Forest</div>
        </div>
        
        <div class="gallery-item">
            <img src="Gallery/img_lights.jpg" alt="northern lights" width="600" height="400">
            <div class="desc" >Northern Lights</div>
        </div>

        <div class="gallery-item">
            <img src="Gallery/img_mountains.jpg" alt="mountains" width="600" height="400">
            <div class="desc">Mountains</div>
        </div>
    </div>
</body>
</html>
