<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfNNKYqDCz4mdjd-DaHhxVTr_58Nhq91ClFaOcadln3L4uA0Q/viewform?embedded=true" width="640" height="385" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    <title>DAY 6</title>
</head>

<style>


    .git {
            background-color: #1e6b45;
            color: #ffffff;
            padding: 30px 10px;
            text-align: center;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
        }

     .git h3 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

    #btn {
        background-color: #1e6b45;
        padding: 10px;
        border-radius: 4px;
    }

    body {
        background-color: #f0f4f8;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
        }

    .container {
        background-color: silver;
        padding: 20px;
        font-weight: 700;
        
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
        width: 400px;

    }

    input , select {
    border-radius: 3rem;
    border-color: antiquewhite;
    background-color:cornsilk;
    }

    textarea {
    resize: vertical;
    min-height: 100px;
        }

    label {
    font-size: 0.9rem;
    font-weight: 700;
    color: #2c3e50;
    display: inline-block;
    margin-bottom: 4px;
        }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select,
    textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cccccc;
        border-radius: 4px;
        font-family: inherit;
        font-size: 0.9rem;
        background-color: #fafafa;
        box-sizing: border-box;
        transition: border-color 0.2s; }

    #btn-reset {
        padding: 10px;
        border-radius: 4px;
    }    

</style>





<body>
   <div class="form-card">
    <div class="git">
        <h3>💬<br>Get In Touch</h3>
    </div>

    <form class="container">
        <label for="full-name">Full Name:</label><br>
        <input type="text" id="full-name" placeholder="Enter your full name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" placeholder="Enter your email" required><br><br>

        <label for="phone-number">Phone Number:</label><br>
        <input type="number" id="phone-number" placeholder="Enter your phone number" required><br><br>

        <label for="subject">Subject:</label><br>
        <select id="subject" name="subject">
            <option value="maths">Maths</option>

            <option value="english">English</option>

            <option value="geography">Geography</option>
        </select><br><br>

        <label for="message" name="message">Message</label><br>
        <textarea name="message">
        </textarea><br><br>

        <input type="checkbox" id="newsletter" name="subscribe" value="newsletter">
        <label for="subscribe">Subscribe to our newsletter</label><br><br>

        <label for="method">Preferred contact method:</label><br>
        <input type="radio" id="email" name="method" value="email">
        <label for="method">E-mail</label>

        <input type="radio" id="phone" name="method" value="phone">
        <label for="method">Phone</label><br><br>

        <button id="btn" type="submit">Send Message</button>
        <button id="btn-reset" type="reset">Clear Form</button>

    </form>
   </div>
</body>
</html>
